server.port=8083
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${database_name:booking_service}
spring.datasource.username=${database_username:root}
spring.datasource.password=${database_password:rootpassword}

# GitHub Login
spring.security.oauth2.client.registration.github.client-id=${GITHUBCLIENTID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUBCLIENTSECRET}

# Google Login

spring.security.oauth2.client.registration.google.client-id=${GOOGLECLIENTID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLECLIENTSECRET}

# JWT Secret key

app.jwt.secret=${JWT_SECRET:en_superhemlig_default_nyckel_som_ar_minst_32_tecken_lang}